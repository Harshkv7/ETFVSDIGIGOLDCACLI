<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gold ETF vs DigiGold Calculator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f1115;
      color: #fff;
      padding: 40px;
    }

    .container {
      max-width: 1300px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 40px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 40px;
    }

    .card {
      background: #1a1d24;
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid #2c313c;
    }

    .inputs {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 250px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #ccc;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #2b303b;
      color: white;
      font-size: 16px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: gold;
      color: black;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .summary-card {
      background: #222733;
      padding: 25px;
      border-radius: 12px;
    }

    .summary-card h3 {
      margin-bottom: 10px;
      color: gold;
    }

    .summary-card p {
      font-size: 28px;
      font-weight: bold;
    }

    .tables {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 40px;
    }

    @media(max-width: 1000px) {
      .tables {
        grid-template-columns: 1fr;
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 10px;
    }

    th {
      background: gold;
      color: black;
      padding: 14px;
      font-size: 14px;
    }

    td {
      background: #1f2430;
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #313744;
      font-size: 14px;
    }

    .table-title {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .winner {
      color: #00ff99;
    }

    .loser {
      color: #ff6b6b;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Gold ETF vs DigiGold</h1>
  <p class="subtitle">
    Compare long term returns after charges
  </p>

  <div class="card">

    <div class="inputs">

      <div class="input-group">
        <label>Investment Amount (₹)</label>
        <input type="number" id="investment" value="1000000">
      </div>

      <div class="input-group">
        <label>Time Period (Years)</label>
        <input type="number" id="years" value="20">
      </div>

    </div>

    <button onclick="calculate()">
      Calculate Returns
    </button>

    <div class="summary">

      <div class="summary-card">
        <h3>ETF Final Value</h3>
        <p id="etfFinal">₹0</p>
      </div>

      <div class="summary-card">
        <h3>DigiGold Final Value</h3>
        <p id="digigoldFinal">₹0</p>
      </div>

      <div class="summary-card">
        <h3>Difference</h3>
        <p id="difference">₹0</p>
      </div>

    </div>

  </div>

  <div class="tables">

    <div>
      <h2 class="table-title">ETF Calculation</h2>

      <table>
        <thead>
          <tr>
            <th>Year</th>
            <th>Invested</th>
            <th>Charges</th>
            <th>Final</th>
          </tr>
        </thead>

        <tbody id="etfTable"></tbody>
      </table>
    </div>

    <div>
      <h2 class="table-title">DigiGold Calculation</h2>

      <table>
        <thead>
          <tr>
            <th>Year</th>
            <th>Invested</th>
            <th>Charges</th>
            <th>Final</th>
          </tr>
        </thead>

        <tbody id="digigoldTable"></tbody>
      </table>
    </div>

  </div>

</div>

<script>

const config = {
  yearlyReturn: 0.11,

  etf: {
    yearlyCharge: 0.01
  },

  digigold: {
    oneTimeCharge: 0.06
  }
};

function formatCurrency(value) {
  return "₹" + Math.round(value).toLocaleString("en-IN");
}

function calculateETF(amount, years) {

  let data = [];

  let current = amount;

  data.push({
    year: 0,
    invested: amount,
    charges: 0,
    final: amount
  });

  for(let i = 1; i <= years; i++) {

    let invested = current * (1 + config.yearlyReturn);

    let charges = invested * config.etf.yearlyCharge;

    let finalAmount = invested - charges;

    data.push({
      year: i,
      invested: invested,
      charges: charges,
      final: finalAmount
    });

    current = finalAmount;
  }

  return data;
}

function calculateDigiGold(amount, years) {

  let data = [];

  let charge = amount * config.digigold.oneTimeCharge;

  let initial = amount - charge;

  data.push({
    year: 0,
    invested: amount,
    charges: charge,
    final: initial
  });

  let current = initial;

  for(let i = 1; i <= years; i++) {

    let invested = current * (1 + config.yearlyReturn);

    data.push({
      year: i,
      invested: invested,
      charges: 0,
      final: invested
    });

    current = invested;
  }

  return data;
}

function renderTable(id, data) {

  const table = document.getElementById(id);

  table.innerHTML = "";

  data.forEach(row => {

    table.innerHTML += `
      <tr>
        <td>${row.year}</td>
        <td>${formatCurrency(row.invested)}</td>
        <td>${formatCurrency(row.charges)}</td>
        <td>${formatCurrency(row.final)}</td>
      </tr>
    `;
  });
}

function calculate() {

  const amount = Number(document.getElementById("investment").value);

  const years = Number(document.getElementById("years").value);

  const etfData = calculateETF(amount, years);

  const digigoldData = calculateDigiGold(amount, years);

  renderTable("etfTable", etfData);

  renderTable("digigoldTable", digigoldData);

  const etfFinal =
    etfData[etfData.length - 1].final;

  const digigoldFinal =
    digigoldData[digigoldData.length - 1].final;

  const diff = digigoldFinal - etfFinal;

  document.getElementById("etfFinal").innerHTML =
    formatCurrency(etfFinal);

  document.getElementById("digigoldFinal").innerHTML =
    formatCurrency(digigoldFinal);

  document.getElementById("difference").innerHTML =
    formatCurrency(Math.abs(diff));

  if(diff > 0) {
    document.getElementById("difference")
      .className = "winner";
  } else {
    document.getElementById("difference")
      .className = "loser";
  }
}

calculate();

</script>

</body>
</html>
